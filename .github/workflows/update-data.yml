name: Daten aktualisieren

on:
  schedule:
    - cron: "17 3 3 * *"      # monatlich am 3. um 03:17 UTC (Vormonat dann vollständig)
  workflow_dispatch:
    inputs:
      force:
        description: "Alle Jahre neu abrufen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten abrufen
        run: python scripts/update_data.py ${{ inputs.force && '--force' || '' }}
      - name: Änderungen committen (auch bei Teilfehlern)
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push
